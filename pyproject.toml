[project]
name = "generalized-es"
version = "0.1.0"
description = "Generalized Evolution Strategies for Mixed-Variable Optimization"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "numpy",
    "matplotlib",
    "cma",
    "pymoo",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
es-model = "src.es_model.main:main"
generalized-es = "src.es_model.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
