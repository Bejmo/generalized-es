[project]
name = "generalized-es"
version = "0.1.0"
description = "Generalized Evolution Strategies for Mixed-Variable Optimization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11, <3.14"
dependencies = [
    "numpy",
    "matplotlib",
    "cma",
    "pymoo",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
es-model = "src.es_model.main:main"
generalized-es = "src.es_model.main:main"
statistical-tests = "experiments.utils.statistical_tests:main"

[project.urls]
Repository = "https://github.com/Bejmo/tfg-generalized-es"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "experiments"]
